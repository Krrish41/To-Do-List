<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Soft drop shadow -->
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.3" />
  </filter>

  <!-- Base squircle with smooth lavender gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" x="10" y="10" rx="24" fill="url(#bgGradient)" filter="url(#shadow)" stroke="#e9d5ff" stroke-width="2" />

  <!-- First item (Checked) -->
  <circle cx="35" cy="40" r="8" fill="url(#primaryGradient)" />
  <path d="M31 40 L34 43 L39 37" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="52" y="36" width="38" height="8" rx="4" fill="#d8b4fe" />

  <!-- Second item (Pending) -->
  <circle cx="35" cy="60" r="7" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <rect x="52" y="56" width="30" height="8" rx="4" fill="#e9d5ff" />

  <!-- Third item (Pending) -->
  <circle cx="35" cy="80" r="7" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <rect x="52" y="76" width="22" height="8" rx="4" fill="#e9d5ff" />
</svg>
